<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:light;font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#111a34;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(130deg,#fff,#f3f6fa);min-height:100vh}h1{font-size:17px;letter-spacing:-.3px;margin:0}h2{font-size:15px;margin:0}p{margin:5px 0;color:#637899;font-size:12px}header{display:flex;gap:13px;align-items:center;margin-bottom:18px}.symbol{background:linear-gradient(145deg,#51afff,#0864ff 70%,#0748e7);box-shadow:inset 0 1px 2px #ffffff66;color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:25px;flex-shrink:0}.symbol.error{background:linear-gradient(140deg,#ff7883,#ed1b32)}.symbol.done{background:linear-gradient(140deg,#91e778,#13af31)}.symbol.confirm{background:linear-gradient(140deg,#ffd06b,#ffa300)}.symbol.cancelled{background:#8c98ab}.tag{font-size:11px;color:#7084a3}dl{display:grid;grid-template-columns:100px 1fr;gap:9px 12px;margin:0}dt{display:flex;align-items:center;font-size:13px}dd{margin:0;border:1px solid #d6deea;background:#fff;border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 1px 2px #192e4e0b}.separator{height:1px;background:#dce3ed;margin:17px 0 12px}label{display:block;font-size:12px;color:#546581}input,select{width:100%;font:13px -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid #d5ddeb;border-radius:6px;background:white;color:#22334e;padding:7px 9px;margin-top:5px}input[readonly]{background:#eef1f5;color:#52627c}button{font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(#fff,#f7f8fb);border:1px solid #d4dceb;box-shadow:0 1px 3px #1a29401a;border-radius:7px;padding:8px 14px;color:#142441}button.primary{color:white;background:linear-gradient(#2489ff,#0752ff);border-color:#0863ff}button:focus-visible,select:focus-visible{outline:3px solid #8cb9ff;outline-offset:2px}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.disclaimer{text-align:center;margin-top:14px;font-size:11px;color:#7183a0}.controls{border:1px solid #dce3ee;border-radius:10px;background:#f9fbff;padding:12px;margin-bottom:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;gap:9px;margin-top:11px}.tabs{display:flex;background:#e9eef5;padding:3px;border-radius:9px;margin-bottom:15px;gap:3px}.tabs button{flex:1;border:0;box-shadow:none;background:transparent;color:#526580;padding:9px 3px;font-size:13px}.tabs button[aria-selected=true]{background:white;color:#0759ff;box-shadow:0 1px 4px #172c4a21}.count{background:#dce6f5;color:#1761d9;border-radius:7px;padding:2px 6px;margin-left:4px}.tabs button[aria-selected=true] .count{background:#0860ff;color:white}.list{border:1px solid #dfe6ef;border-radius:10px;background:#fff;min-height:205px;padding:0 14px}.empty{text-align:center;padding:53px 16px}.row{padding:17px 0}.row+.row{border-top:1px solid #e3e8f0}.row-head{display:flex;align-items:center;gap:13px}.row-main{flex:1;min-width:0}.row strong{font-size:15px}.row .symbol{width:36px;height:36px;font-size:22px}.advance{margin-top:9px;font-size:11px;padding:5px 9px;color:#1260d5;background:#eef4ff;box-shadow:none}.details{margin:10px 0 0 49px;font-size:12px;color:#637899}.details summary{color:#335f9a}.details p{overflow-wrap:anywhere}.screen{overflow-wrap:anywhere}body.toast{padding:16px 18px;background:linear-gradient(125deg,#fff,#f9fbff);border:1px solid #dce4ef;border-radius:12px;min-height:0}.toast header{margin-bottom:7px}.toast .toast-copy{flex:1;min-width:0}.toast footer{margin-top:5px}.toast button{padding:5px 10px;font-size:12px}.toast .disclaimer{margin:7px 0 0;text-align:left}[hidden]{display:none!important}
body:not(.toast){display:flex;flex-direction:column;padding-bottom:12px}.window-close{align-self:flex-end;margin-top:auto;padding:8px 2px 0;border:0;box-shadow:none;background:transparent;color:#637899;border-radius:3px;font-size:12px;cursor:pointer}.window-close:hover{color:#0759ff;text-decoration:underline}

.artifact{margin:14px 0;padding-top:12px;border-top:1px solid #e3e8f0}.artifact code,.artifact pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;user-select:text}.artifact label{margin-top:8px}.artifact-link{display:block;text-align:left;word-break:break-all;border:0;box-shadow:none;background:none;color:#0759ff;padding:3px 0;font-size:12px}.reason{white-space:pre-wrap;overflow-wrap:anywhere}.destination{overflow-wrap:anywhere}.confirm-action{margin-top:8px}.toast .artifact{margin:14px 0;padding-top:12px;border-top:1px solid #e3e8f0}.artifact code,.artifact pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;user-select:text}.artifact label{margin-top:8px}.artifact-link{display:block;text-align:left;word-break:break-all;border:0;box-shadow:none;background:none;color:#0759ff;padding:3px 0;font-size:12px}.reason{max-height:40px;overflow:auto}
body:not(.toast){height:100vh;overflow:hidden}body:not(.toast) #app{flex:1;min-height:0;overflow-y:auto;padding-right:4px}.window-close{flex-shrink:0;margin-top:8px}
/* Toast is one full-window surface, with no nested scrolling card. */
body.toast{height:100vh;min-height:0;overflow:hidden;padding:18px 20px;border-radius:0}
.toast #app{height:100%;display:flex;flex-direction:column;min-width:0}
.toast header{padding-right:24px;gap:14px;align-items:flex-start;margin:0;flex:1;min-height:0}
.toast .symbol{width:40px;height:40px;font-size:25px;margin-top:1px}
.toast h2{font-size:16px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.toast .toast-copy p{font-size:13px;line-height:1.4;margin:5px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.toast footer{margin:10px 0 0;align-items:center;justify-content:flex-end;flex-shrink:0;gap:16px}
.toast button{background:none;border:0;box-shadow:none;padding:3px 0;font-size:12px;cursor:pointer;border-radius:3px}
.toast #open{color:#0759ff;background:#edf4ff;border:1px solid #ccddf8;border-radius:6px;padding:6px 12px;font-weight:500}
.toast #open:hover{background:#e2edff;text-decoration:none}
.toast #dismiss{position:absolute;top:8px;right:8px;width:28px;height:28px;padding:0;display:grid;place-items:center;color:#637899;font-size:22px;line-height:1;border-radius:4px}
.toast #dismiss:hover{background:#e9eef5;color:#253854;text-decoration:none}
.toast button:hover{text-decoration:underline}.toast button:focus-visible{outline:2px solid #8cb9ff;outline-offset:3px}
.history-tools{display:flex;justify-content:flex-end;margin:-3px 0 12px}.history-tools button{font-size:12px;padding:6px 10px;background:#fff;color:#637899}.history-tools button:disabled{opacity:.45;cursor:default}
.details p:empty{display:none}
.script-console{box-sizing:border-box;height:140px;max-height:clamp(64px,calc(100vh - 430px),140px);margin:10px 0 0;padding:10px 12px;border:1px solid #242830;border-radius:7px;background:#080a0d;color:#e5e7eb;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;user-select:text;color-scheme:dark}
</style></head><body><main id="app"></main><script>
const D=__TASK_DATA__, app=document.getElementById('app');
const t=k=>D.strings['task_ui.'+k]||k;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=k=>esc(t(k));
const send=body=>window.webkit.messageHandlers['taskUI'+D.kind].postMessage(body);
const icon=j=>`<div class="symbol ${j.state==='done'?'done':j.state==='cancelled'?'cancelled':j.state==='error'?'error':j.phase==='confirm'?'confirm':''}" aria-hidden="true">${j.state==='done'?'✓':j.state==='cancelled'?'−':j.state==='error'||j.phase==='confirm'?'!':'↻'}</div>`;
const phase=j=>j.kind==='script'?esc(j.message):j.kind==='text'?esc(t(j.state==='busy'?'text_busy':j.state==='done'?'text_done':'text_error')):j.kind==='pipeline'?esc(t(j.state==='busy'?'pipeline_read':j.state==='error'?'pipeline_error':j.empty?'pipeline_empty':'pipeline_done')):esc(j.state==='busy'?t(j.phase==='create'?'creating':j.phase):t(j.state));
const destination=j=>esc([j.account,j.profile,j.region,j.instance,j.pipeline].filter(Boolean).join(' · '));
const provider=j=>j.kind==='text'&&['lmstudio','openrouter'].includes(j.provider)?`<p class="provider">${txt('provider')}: ${j.provider==='openrouter'?'OpenRouter':'LM Studio'}</p>`:'';
const artifacts=j=>j.kind!=='pipeline'?'':`<p>${txt('pipeline_latest')}</p><p>${txt('pipeline_execution')}: ${esc(j.executionId||'—')}</p><p>${txt('pipeline_status')}: ${esc(j.executionStatus||'—')}</p>${(j.artifacts||[]).map((a,i)=>`<section class="artifact"><strong>${esc(a.name||'—')}</strong><label>revisionId</label><code>${esc(a.revisionId||'—')}</code><label>revisionSummary</label><pre>${esc(a.revisionSummary||'—')}</pre><label>revisionUrl</label>${/^https:\/\//.test(a.revisionUrl)?`<button class="artifact-link" data-artifact="${i+1}" data-job="${esc(j.uid)}">${esc(a.revisionUrl)}</button>`:`<pre>${esc(a.revisionUrl||'—')}</pre>`}</section>`).join('')}${j.state==='done'&&!j.empty&&!(j.artifacts||[]).length?`<p>${txt('pipeline_no_artifacts')}</p>`:''}`;
document.documentElement.lang=t('language');
if(D.kind==='confirm'){
 const j=D.job;
 if(j.kind==='script'){
 app.innerHTML=`<header>${icon(j)}<div><h1>${esc(j.title)}</h1><p>${txt('script_select')}</p></div></header>${(j.inputs||[]).map((input,i)=>`<label for="script-input-${i}">${esc(input.label)}</label><select id="script-input-${i}">${input.options.map(option=>`<option value="${esc(option.value)}" ${j.selection?.[input.name]===option.value?'selected':''}>${esc(option.label)}</option>`).join('')}</select>`).join('')}<footer><button id="cancel">${txt('cancel')}</button><button id="create" class="primary">${txt('script_run')}</button></footer>`;
 document.getElementById('cancel').onclick=()=>send({action:'cancel',id:j.uid});
 document.getElementById('create').onclick=e=>{e.target.disabled=true;const values=Object.fromEntries(j.inputs.map((input,i)=>[input.name,document.getElementById('script-input-'+i).value]));send({action:'confirm',id:j.uid,values});};
 }else{
 app.innerHTML=`<header>${icon(j)}<div><h1>${txt('confirm_title')}</h1><p>${esc(j.title)}</p><p>${txt('review')}</p></div></header><dl>${['account','profile','region','instance'].map(k=>`<dt>${txt(k)}</dt><dd>${esc(j[k])}</dd>`).join('')}</dl><div class="separator"></div><label>${txt('name')}</label><input readonly value="${esc(j.name)}"><p>${txt('follow')}</p><footer><button id="cancel">${txt('cancel')}</button><button id="create" class="primary">${txt('create')}</button></footer>`;
 document.getElementById('cancel').onclick=()=>send({action:'cancel',id:j.uid});
 document.getElementById('create').onclick=e=>{e.target.disabled=true;send({action:'confirm',id:j.uid});};
 }
}else if(D.kind==='toast'){
 document.body.className='toast'; const j=D.job;
 app.innerHTML=`<header>${icon(j)}<div class="toast-copy"><h2>${esc(j.title)}</h2><p>${phase(j)}</p></div></header><button id="dismiss" aria-label="${txt('close')}" title="${txt('close')}">×</button><footer><button id="open">${txt(j.state==='error'?'details':'open')}</button></footer>`;
 document.getElementById('dismiss').onclick=()=>send({action:'dismiss'});
 document.getElementById('open').onclick=()=>send({action:'open',id:j.uid});
}else{
 app.innerHTML=`<header><div><h1>${txt('center_title')}</h1><p>${txt('subtitle')}</p></div></header><div class="tabs" role="tablist">${['attention','running','history'].map(k=>`<button data-tab="${k}" role="tab" aria-selected="${k===D.tab}">${txt(k)}</button>`).join('')}</div>${D.tab==='history'?`<div class="history-tools"><button id="clearHistory" title="${txt('clear_history_hint')}" ${D.jobs.some(j=>['done','error','cancelled'].includes(j.state))?'':'disabled'}>${txt('clear_history')}</button></div>`:''}<div class="list">${D.jobs.filter(j=>D.tab==='attention'?j.state==='error'||j.phase==='confirm':D.tab==='running'?j.state==='busy'&&j.phase!=='confirm':j.state==='done'||j.state==='cancelled').slice().reverse().map(j=>`<article class="row"><div class="row-head">${icon(j)}<div class="row-main"><strong>${esc(j.title)}</strong><p>${phase(j)}</p><span class="tag">${esc(j.time)} · ${txt(j.origin)}</span></div></div><details class="details" ${j.uid===D.selected?'open':''}><summary>${txt('details')}</summary><p class="destination">${destination(j)}</p><p>${esc(j.name)}</p>${provider(j)}<p class="reason">${esc(j.reason)}</p>${artifacts(j)}${j.kind==='script'?`<pre class="script-console">${esc(j.logs)}</pre>`:''}</details>${j.phase==='confirm'?`<button class="confirm-action" data-review="${esc(j.uid)}">${txt('review_button')}</button>`:''}</article>`).join('')||`<p class="empty">${txt('empty')}</p>`}</div><p class="disclaimer">${txt('session')}</p>`;
 if(D.tab==='history')document.getElementById('clearHistory').onclick=()=>send({action:'clearHistory'});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>send({action:'tab',tab:b.dataset.tab}));
 document.querySelectorAll('[data-artifact]').forEach(b=>b.onclick=()=>send({action:'artifact',id:b.dataset.job,index:Number(b.dataset.artifact)}));
 document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>send({action:'review',id:b.dataset.review}));
}
if(D.kind!=='toast'){
 const close=()=>send(D.kind==='confirm'?{action:'cancel',id:D.job.uid}:{action:'dismiss'});
 const b=document.createElement('button');b.className='window-close';b.textContent=t('close');b.onclick=close;document.body.append(b);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}});
}
</script></body></html>
