<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:12px -apple-system,BlinkMacSystemFont,sans-serif;background:#2d2d2d;color:#ddd;margin:8px;display:grid;grid-template-columns:94px minmax(0,1fr);gap:7px;align-items:center}label{line-height:1.3}input,select{box-sizing:border-box;width:100%;background:#414141;color:#fff;border:1px solid #666;border-radius:4px;padding:6px;font:inherit}small{grid-column:2;color:#aaa;line-height:1.3;font-size:11px}p{grid-column:1/-1;color:#aaa;line-height:1.3;margin:2px 0;font-size:11px}#feedback{min-height:14px;color:#f9b44a}[hidden]{display:none!important}button{grid-column:2;background:#1473cc;color:white;border:0;border-radius:4px;padding:7px;cursor:pointer}</style>
</head><body>
<label for="emoji" id="emojiLabel"></label><input type="text" id="emoji" autocomplete="off" placeholder="cut_of_meat">
<small id="emojiHelp"></small>
<label for="message" id="messageLabel"></label><input id="message" autocomplete="off">
<label for="duration" id="durationLabel"></label><select id="duration"></select>
<label for="target" id="targetLabel"></label><select id="target"></select>
<label for="presenceDuration" id="presenceDurationLabel"></label><select id="presenceDuration"></select>
<button type="button" id="save"></button>
<p id="hint"></p><p id="feedback" role="status"></p>
<script type="module" src="presence-ui.mjs"></script>
</body></html>
